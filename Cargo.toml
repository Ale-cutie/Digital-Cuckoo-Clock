[package]
name    = "u545-ili9341-test"
version = "0.1.0"
edition = "2021"
default-run = "u545-ili9341-test"

[dependencies]
# --- Embassy framework for STM32U545 ---------------------------------------
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32    = { version = "0.6.0", features = [
    "stm32u545re",        # ← matches the MCU on the Nucleo-U545RE-Q          # ← embassy supplies the linker memory map
    "time-driver-any",
    "exti",
] }
embassy-time     = { version = "0.5.1" }

# --- Cortex-M plumbing ------------------------------------------------------
cortex-m    = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# --- RTT logging + panic handler (works out of the box with probe-rs) ------
defmt       = "1.1.0"
defmt-rtt   = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# --- Display + graphics stack ----------------------------------------------
embedded-hal          = "1.0"
embedded-hal-bus      = "0.3"
display-interface-spi = "0.5"
ili9341               = "0.6"
embedded-graphics     = "0.8"
dht-sensor           = { version = "0.3", features = ["async"] }
embedded-hal-async   = "1.0"
embedded-hal-nb      = "1.0"
embedded-io          = "0.7.1"
libm                 = "0.2"
micromath            = "2.1.0"

[profile.release]
debug     = 2
lto       = true
opt-level = "z"

[profile.dev]
# ili9341 init does a lot of work; running fully unoptimized makes flashing slow.
opt-level = "s"
debug     = 2
